name: Publish release

on:
  release:
    types: [released, prereleased]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write    
    steps:
      - if: startsWith(${{ github.event.release.tag_name }}, "v")
        id: version
        run: echo "::set-output name=version::$(echo ${{ github.event.release.tag_name }} | cut -c2-)"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup GPG keys for signed commits
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - uses: actions/setup-node@v2
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Update package.json
        run: |
          cd server
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          npm ci
          npm run build:routes
          git add package.json openapi.json
          git commit -m "${{ steps.version.outputs.version }}"
          git tag --force ${{ github.event.release.tag_name }}
          git push
          git push --force --tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - if: ${{ github.event.action == 'prereleased' }}
        name: Publish to GitHub [prerelease]
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:unstable
      - if: ${{ github.event.action == 'released' }}
        name: Publish to GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:unstable,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
